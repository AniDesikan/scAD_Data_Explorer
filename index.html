<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hippocampus scRNA Explorer</title>
<link rel="stylesheet" href="css/style.css?v=f851790d1f">
<!-- Libraries only. Your data never leaves the browser. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.0/plotly.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<meta name="hx-build" content="8379bf0309">
<script>(function(){try{var b='8379bf0309';fetch('version.txt',{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(v){v=(v||'').trim();if(!v||v===b||sessionStorage.getItem('hx-reload-'+v))return;sessionStorage.setItem('hx-reload-'+v,'1');var u=new URL(location.href);u.searchParams.set('b',v);location.replace(u.toString());}).catch(function(){});}catch(e){}})();</script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span id="app-title">Hippocampus scRNA-seq Explorer</span><span id="demo-badge" class="badge warn hidden">SIMULATED DEMO DATA</span></div>
  <nav id="tabs">
    <a href="#atlas" data-tab="atlas">Overview</a>
    <a href="#explore" data-tab="explore">Cell type</a>
    <a href="#refs" data-tab="refs">Published data</a>
    <a href="#notes" data-tab="notes">Notebook <span id="notes-count" class="count"></span></a>
    <a href="#data" data-tab="data">Data &amp; settings</a>
  </nav>
  <div class="search">
    <input id="global-search" type="search" placeholder="Search a gene or pathway…" autocomplete="off" spellcheck="false">
    <div id="search-results" class="dropdown hidden"></div>
  </div>
  <button id="lock-btn" class="lock-btn hidden" title="Forget the unlocked data in this browser and ask for the passphrase again (your notes are kept)">🔒</button>
</header>

<main id="view"></main>

<aside id="drawer" class="drawer hidden" aria-label="Details">
  <div class="drawer-head">
    <button id="drawer-back" class="small" title="Back">←</button>
    <div id="drawer-crumbs"></div>
    <button id="drawer-close" class="small" title="Close (Esc)">✕</button>
  </div>
  <div id="drawer-body"></div>
</aside>

<div id="toast"></div>

<script src="js/views/explore.js?v=fd7057ec50"></script>
<script src="js/views/bulk.js?v=4fe3467361"></script>
<script src="js/views/refs.js?v=e3bfc4b979"></script>
<script src="js/views/notes.js?v=7dd333fba5"></script>
<script src="js/views/data.js?v=943dad1660"></script>
<script src="js/app.js?v=829bf234ed"></script>
</body>
</html>
